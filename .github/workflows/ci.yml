name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
            derived-data: ios
          - name: tvOS Simulator
            destination: generic/platform=tvOS Simulator
            derived-data: tvos
          - name: macOS
            destination: generic/platform=macOS
            derived-data: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate release metadata
        run: |
          plutil -lint WorldTV/PrivacyInfo.xcprivacy
          jq empty WorldTV/Resources/Localizable.xcstrings
          test -s PRIVACY.md
          test -s SUPPORT.md
          test -s docs/APP_STORE_METADATA.md

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WorldTV.xcodeproj \
            -scheme WorldTV \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.derived-data }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Swift Testing suites
        run: |
          set -o pipefail
          xcodebuild \
            -project WorldTV.xcodeproj \
            -scheme WorldTV \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tests" \
            -only-testing:WorldTVTests \
            test
